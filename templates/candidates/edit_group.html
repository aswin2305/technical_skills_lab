{% extends 'base.html' %}
{% block title %}Edit Group | Technical Skills Lab{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4">Edit <span class="text-gradient">{{ group.name }}</span></h2>
        <div class="tsl-card">
            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3"><label>Group Name</label>{{ form.name }}</div>
                <div class="mb-3"><label>Department</label>{{ form.department }}</div>
                <div class="mb-3"><label>Description</label>{{ form.description }}</div>
                <button type="submit" class="tsl-btn-primary w-100">Save Changes</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
