{% extends 'base.html' %}
{% block title %}Change Password | Technical Skills Lab{% endblock %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 450px;">
        <h2 class="mb-4 text-center">Change <span class="text-gradient">Password</span></h2>
        <div class="tsl-card">
            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label>Old Password</label>
                    {{ form.old_password }}
                </div>
                <div class="mb-3">
                    <label>New Password</label>
                    {{ form.new_password1 }}
                </div>
                <div class="mb-3">
                    <label>Confirm New Password</label>
                    {{ form.new_password2 }}
                </div>
                <button type="submit" class="tsl-btn-primary w-100">Update Password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
