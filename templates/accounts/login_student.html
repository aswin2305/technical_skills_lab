{% extends 'base.html' %}
{% block title %}Student Login | Technical Skills Lab{% endblock %}

{% block content %}
<section class="section d-flex align-items-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 420px;">
        <div class="tsl-card">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-graduate fs-1" style="color:var(--accent-primary);"></i>
                <h3 class="mt-2">Student Login</h3>
                <p class="text-muted-custom">Use the credentials provided by your admin</p>
            </div>
            <form method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label>Username</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="tsl-btn-primary w-100 mt-2">Login</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
